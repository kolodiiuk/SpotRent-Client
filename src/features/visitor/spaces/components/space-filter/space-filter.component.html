<div class="space-filter bg-white p-6 rounded-lg shadow-sm border border-gray-100 flex flex-col gap-4">
  <h2 class="text-xl font-semibold text-gray-800">Filters</h2>
  <form [formGroup]="filterForm" class="flex flex-col gap-4">
    <div class="form-group">
      <label class="block text-sm font-medium text-gray-700 mb-1">Search Spaces</label>
      <input type="text" formControlName="search" placeholder="E.g., Conference room..." 
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
    </div>
    
    <div class="form-group">
      <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
      <input type="text" formControlName="city" placeholder="E.g., New York" 
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
    </div>

    <div class="form-group flex justify-between gap-2">
      <div class="flex-1">
        <label class="block text-sm font-medium text-gray-700 mb-1">Min Capacity</label>
        <input type="number" formControlName="minCapacity" placeholder="0" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="flex-1">
        <label class="block text-sm font-medium text-gray-700 mb-1">Max Capacity</label>
        <input type="number" formControlName="maxCapacity" placeholder="100" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>
    
    <div class="form-group flex justify-between gap-2">
      <div class="flex-1">
        <label class="block text-sm font-medium text-gray-700 mb-1">Min Rate ($/hr)</label>
        <input type="number" formControlName="minHourlyRate" placeholder="0" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="flex-1">
        <label class="block text-sm font-medium text-gray-700 mb-1">Max Rate ($/hr)</label>
        <input type="number" formControlName="maxHourlyRate" placeholder="500" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>
  </form>
</div>
