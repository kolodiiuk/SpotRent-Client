<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Discover Spaces</h1>
    <p class="mt-2 text-lg text-gray-600">Find the perfect space for your next meeting, event, or workday.</p>
  </div>

  <div class="flex flex-col lg:flex-row gap-8">
    <!-- Left Sidebar: Filtration and Search -->
    <aside class="w-full lg:w-1/4 xl:w-1/5 flex-shrink-0">
      <div class="sticky top-6">
        <app-space-filter (filterChanged)="onFilterChanged($event)"></app-space-filter>
      </div>
    </aside>

    <!-- Main Content: Spaces List -->
    <main class="w-full lg:w-3/4 xl:w-4/5 flex-grow">
      <div class="flex justify-between items-center mb-6">
        <p class="text-sm text-gray-600">
          Showing <span class="font-semibold">{{ spaces.length }}</span> matches
        </p>
      </div>
      
      <app-space-list [spaces]="spaces" [isLoading]="isLoading"></app-space-list>
    </main>
  </div>
</div>
