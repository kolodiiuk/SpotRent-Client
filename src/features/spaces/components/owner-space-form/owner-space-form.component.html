<div class="px-4 sm:px-6 lg:px-8 py-8 w-full max-w-4xl mx-auto">
  <div class="mb-8">
    <a routerLink="/owner/spaces" class="text-blue-600 hover:text-blue-800 font-medium flex items-center gap-2 mb-4">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Back to Spaces
    </a>
    <h1 class="text-2xl md:text-3xl text-gray-800 font-bold">{{ isEditMode ? 'Edit Space' : 'Create a New Space' }}</h1>
    <p class="mt-2 text-gray-600">Provide details about your space to attract the right people.</p>
  </div>

  <div *ngIf="isLoading" class="flex justify-center p-8">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
  </div>

  <div *ngIf="error" class="p-4 mb-6 bg-red-50 text-red-700 rounded-lg text-center font-medium border border-red-100">
    {{ error }}
  </div>

  <form *ngIf="!isLoading" [formGroup]="spaceForm" (ngSubmit)="onSubmit()" class="bg-white shadow-sm rounded-xl border border-gray-100 p-8">
    
    <div class="space-y-6">
      
      <!-- Basics Section -->
      <div>
        <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b border-gray-100 pb-2">Basic Info</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Space Name *</label>
            <input type="text" formControlName="name" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., Bright Corner Office">
            <div *ngIf="spaceForm.get('name')?.invalid && spaceForm.get('name')?.touched" class="text-red-500 text-xs mt-1">Name is required.</div>
          </div>

          <div class="col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Description *</label>
            <textarea formControlName="description" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Describe the space..."></textarea>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Space Type *</label>
            <select formControlName="spaceType" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option *ngFor="let type of spaceTypes" [value]="type.value">{{ type.label }}</option>
            </select>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Room Identifier</label>
            <input type="text" formControlName="room" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., Room 101">
          </div>
        </div>
      </div>

      <!-- Specs Section -->
      <div class="mt-8">
        <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b border-gray-100 pb-2">Specifications & Pricing</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Capacity (people) *</label>
            <input type="number" formControlName="capacity" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" min="1">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Area (sqm) *</label>
            <input type="number" formControlName="areaSqm" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" step="0.1" min="1">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Hourly Rate ($) *</label>
            <input type="number" formControlName="hourlyRate" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" step="0.01" min="0">
          </div>
        </div>
      </div>

      <!-- Settings Section -->
      <div class="mt-8">
         <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b border-gray-100 pb-2">Media & Settings</h2>
         
         <div class="space-y-6">
           <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Image URL</label>
            <input type="text" formControlName="imageUrl" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://example.com/image.jpg">
           </div>

           <div>
              <label class="block text-sm font-medium text-gray-700 mb-1 text-red-500">Address ID * (Mock logic)</label>
              <!-- Adding address logic usually requires a separate modal/API search. Using hardcoded mock fallback for simplicity -->
              <input type="number" formControlName="addressId" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="1">
           </div>

           <div class="flex items-center gap-3 mt-4">
             <input type="checkbox" formControlName="isAvailable" id="isAvailable" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded cursor-pointer">
             <label for="isAvailable" class="text-sm font-medium text-gray-700 cursor-pointer">Available for Booking</label>
           </div>
         </div>
      </div>
      
    </div>

    <!-- Actions -->
    <div class="mt-10 pt-6 border-t border-gray-100 flex justify-end gap-4">
      <button type="button" routerLink="/owner/spaces" class="btn bg-white border border-gray-200 hover:bg-gray-50 text-gray-600 px-6 py-2 rounded-lg font-medium transition-colors">
        Cancel
      </button>
      <button type="submit" [disabled]="spaceForm.invalid || isSaving" class="btn bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="isSaving" class="mr-2 inline-block animate-spin h-4 w-4 border-2 border-white rounded-full border-t-transparent"></span>
        {{ isEditMode ? 'Update Space' : 'Create Space' }}
      </button>
    </div>

  </form>
</div>
