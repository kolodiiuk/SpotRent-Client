<div class="px-4 sm:px-6 lg:px-8 py-8 w-full max-w-9xl mx-auto">
  <div class="sm:flex sm:justify-between sm:items-center mb-8">
    <div class="mb-4 sm:mb-0">
      <h1 class="text-2xl md:text-3xl text-gray-800 font-bold">My Spaces 🏢</h1>
    </div>
    <div class="grid grid-flow-col sm:auto-cols-max justify-start sm:justify-end gap-2">
      <button class="btn bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-colors" routerLink="/owner/spaces/new">
        <svg class="w-4 h-4 fill-current opacity-50 shrink-0 mr-2 inline-block" viewBox="0 0 16 16">
          <path d="M15 7H9V1c0-.6-.4-1-1-1S7 .4 7 1v6H1c-.6 0-1 .4-1 1s.4 1 1 1h6v6c0 .6.4 1 1 1s1-.4 1-1V9h6c.6 0 1-.4 1-1s-.4-1-1-1z" />
        </svg>
        <span>Add Space</span>
      </button>
    </div>
  </div>

  <div *ngIf="isLoading" class="flex justify-center p-8">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
  </div>

  <div *ngIf="!isLoading && spaces.length === 0" class="bg-white p-8 rounded-xl border border-gray-100 shadow-sm text-center">
    <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
    </svg>
    <h3 class="text-lg font-medium text-gray-900 mb-1">No spaces created yet</h3>
    <p class="text-gray-500 mb-4">Start by adding your first space for rent.</p>
    <button class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-4 py-2 rounded-md font-medium transition-colors" routerLink="/owner/spaces/new">
      Create a Space
    </button>
  </div>

  <div *ngIf="!isLoading && spaces.length > 0" class="bg-white shadow-sm rounded-xl border border-gray-100 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="table-auto w-full border-collapse">
        <thead class="text-xs uppercase text-gray-500 bg-gray-50 border-b border-gray-100">
          <tr>
            <th class="px-6 py-4 whitespace-nowrap font-semibold text-left">Space Name</th>
            <th class="px-6 py-4 whitespace-nowrap font-semibold text-left">Type</th>
            <th class="px-6 py-4 whitespace-nowrap font-semibold text-left">Location</th>
            <th class="px-6 py-4 whitespace-nowrap font-semibold text-left">Rate</th>
            <th class="px-6 py-4 whitespace-nowrap font-semibold text-center">Status</th>
            <th class="px-6 py-4 whitespace-nowrap font-semibold text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="text-sm divide-y divide-gray-100">
          <tr *ngFor="let space of spaces" class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="flex items-center">
                <div class="font-medium text-gray-900">{{ space.name }}</div>
              </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="text-gray-600">{{ space.spaceType }}</span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-gray-600">
              {{ space.address?.city }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">
              ${{ space.hourlyRate }}/hr
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-center">
              <span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full"
                    [ngClass]="space.isAvailable ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
                {{ space.isAvailable ? 'Available' : 'Hidden' }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
              <button [routerLink]="['/owner/spaces', space.id, 'edit']" class="text-indigo-600 hover:text-indigo-900 mr-4 transition-colors">Edit</button>
              <button (click)="deleteSpace(space.id)" class="text-red-600 hover:text-red-900 transition-colors">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
