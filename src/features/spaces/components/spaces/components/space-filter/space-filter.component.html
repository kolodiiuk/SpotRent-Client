<div class="space-filter layout-glass-card p-6 flex flex-col gap-4">
  <h2 class="text-xl font-semibold text-neutral-900 dark:text-neutral-100">{{ 'SPACES_BROWSE.FILTERS.TITLE' | translate }}</h2>
  <form [formGroup]="filterForm" (submit)="$event.preventDefault()" class="flex flex-col gap-4">
    <div class="form-group">
      <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">{{ 'SPACES_BROWSE.FILTERS.SPACE_TYPE' | translate }}</label>
      <select
        formControlName="spaceType"
        class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors">
        <option [ngValue]="null">{{ 'SPACES_BROWSE.FILTERS.ANY_TYPE' | translate }}</option>
        @for (type of spaceTypeOptions; track type) {
          <option [ngValue]="type">{{ type | stringSpaceType }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">{{ 'SPACES_BROWSE.FILTERS.CITY' | translate }}</label>
      <input type="text" formControlName="city" [placeholder]="'SPACES_BROWSE.FILTERS.CITY_PLACEHOLDER' | translate"
        class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition-colors">
    </div>

    <div class="form-group flex justify-between gap-2">
      <div class="flex-1">
        <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">{{ 'SPACES_BROWSE.FILTERS.MIN_CAPACITY' | translate }}</label>
        <input type="number" formControlName="minCapacity" placeholder="0"
          class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
      </div>
      <div class="flex-1">
        <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">{{ 'SPACES_BROWSE.FILTERS.MAX_CAPACITY' | translate }}</label>
        <input type="number" formControlName="maxCapacity" placeholder="100"
          class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
      </div>
    </div>

    <div class="form-group flex justify-between gap-2">
      <div class="flex-1">
        <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">{{ 'SPACES_BROWSE.FILTERS.MIN_AREA' | translate }}</label>
        <input type="number" formControlName="minAreaSqm" placeholder="0"
          class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
      </div>
      <div class="flex-1">
        <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">{{ 'SPACES_BROWSE.FILTERS.MAX_AREA' | translate }}</label>
        <input type="number" formControlName="maxAreaSqm" placeholder="500"
          class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
      </div>
    </div>

    <div class="form-group flex justify-between gap-2">
      <div class="flex-1">
        <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">{{ 'SPACES_BROWSE.FILTERS.MIN_RATE' | translate }}</label>
        <input type="number" formControlName="minHourlyRate" placeholder="0"
          class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
      </div>
      <div class="flex-1">
        <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">{{ 'SPACES_BROWSE.FILTERS.MAX_RATE' | translate }}</label>
        <input type="number" formControlName="maxHourlyRate" placeholder="500"
          class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
      </div>
    </div>

    <div class="form-group">
      <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">{{ 'SPACES_BROWSE.FILTERS.SORT' | translate }}</label>
      <select
        formControlName="sort"
        class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition-colors">
        <option value="">{{ 'SPACES_BROWSE.FILTERS.SORT_DEFAULT' | translate }}</option>
        <option value="price-asc">{{ 'SPACES_BROWSE.FILTERS.SORT_PRICE_ASC' | translate }}</option>
        <option value="price-desc">{{ 'SPACES_BROWSE.FILTERS.SORT_PRICE_DESC' | translate }}</option>
        <option value="newest">{{ 'SPACES_BROWSE.FILTERS.SORT_NEWEST' | translate }}</option>
      </select>
    </div>
  </form>
</div>
