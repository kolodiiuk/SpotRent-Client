<div class="space-filter layout-glass-card p-6 flex flex-col gap-4">
  <h2 class="text-xl font-semibold text-neutral-900 dark:text-neutral-100">Filters</h2>
  <form [formGroup]="filterForm" class="flex flex-col gap-4">
    <div class="form-group">
      <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Search Spaces</label>
      <input type="text" formControlName="search" placeholder="E.g., Conference room..." 
        class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors">
    </div>
    
    <div class="form-group">
      <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">City</label>
      <input type="text" formControlName="city" placeholder="E.g., New York" 
        class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition-colors">
    </div>

    <div class="form-group flex justify-between gap-2">
      <div class="flex-1">
        <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Min Capacity</label>
        <input type="number" formControlName="minCapacity" placeholder="0" 
          class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
      </div>
      <div class="flex-1">
        <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Max Capacity</label>
        <input type="number" formControlName="maxCapacity" placeholder="100" 
          class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
      </div>
    </div>
    
    <div class="form-group flex justify-between gap-2">
      <div class="flex-1">
        <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Min Rate ($/hr)</label>
        <input type="number" formControlName="minHourlyRate" placeholder="0" 
          class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
      </div>
      <div class="flex-1">
        <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Max Rate ($/hr)</label>
        <input type="number" formControlName="maxHourlyRate" placeholder="500" 
          class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 bg-white/90 dark:bg-neutral-900/80 text-neutral-900 dark:text-neutral-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
      </div>
    </div>
  </form>
</div>
