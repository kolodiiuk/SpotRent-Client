<div class="space-list-container h-full">
  <div *ngIf="isLoading" class="flex justify-center items-center py-20">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
  </div>

  <div *ngIf="!isLoading && spaces.length === 0" class="text-center py-20 bg-gray-50 rounded-lg border border-gray-100">
    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
    <h3 class="mt-2 text-sm font-medium text-gray-900">No spaces found</h3>
    <p class="mt-1 text-sm text-gray-500">Try adjusting your filters or search terms.</p>
  </div>

  <div *ngIf="!isLoading && spaces.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let space of spaces" class="space-card bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 border border-gray-100 overflow-hidden flex flex-col cursor-pointer" [routerLink]="['/spaces', space.id]">
      <div class="h-48 bg-gray-200 relative">
        <img *ngIf="space.imageUrl" [src]="space.imageUrl" [alt]="space.name" class="w-full h-full object-cover">
        <div *ngIf="!space.imageUrl" class="w-full h-full flex items-center justify-center text-gray-400 bg-gray-100 rounded-t-xl">
          <svg class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
        <div class="absolute top-3 right-3 bg-white px-2 py-1 rounded-md text-sm font-semibold text-gray-800 shadow">
          ${{ space.hourlyRate }}/hr
        </div>
      </div>
      
      <div class="p-5 flex flex-col flex-grow">
        <h3 class="text-lg font-bold text-gray-900 mb-1 truncate">{{ space.name }}</h3>
        <p class="text-sm text-gray-500 mb-3 truncate">{{ space.address?.city }}</p>
        
        <div class="flex items-center text-sm text-gray-600 mb-4 gap-4">
          <div class="flex items-center gap-1">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            <span>Up to {{ space.capacity }}</span>
          </div>
          <div class="flex items-center gap-1">
             <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
            </svg>
            <span>{{ space.areaSqm }} m²</span>
          </div>
        </div>
        
        <div class="mt-auto pt-4 border-t border-gray-100 flex justify-between items-center">
          <span class="text-xs font-medium px-2 py-1 bg-blue-50 text-blue-700 rounded-full">
            {{ space.spaceType | number }} <!-- Usually we map this to text -->
          </span>
          <button class="text-sm font-medium text-blue-600 hover:text-blue-800 transition-colors">
            View Details &rarr;
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
