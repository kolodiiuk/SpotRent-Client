<div [class]="styles.bg + ' ' + styles.border + ' ' + styles.text + ' border rounded-lg p-4'">
  <div class="flex items-start">
    <fa-icon [icon]="styles.icon" class="text-xl mr-3 mt-0.5"></fa-icon>
    <div class="flex-1">
      @if (title) {
        <h4 class="font-semibold mb-1">{{ title }}</h4>
      }
      <div class="text-sm">
        <ng-content></ng-content>
      </div>
    </div>
    @if (close.observed) {
      <button (click)="onClose()" class="ml-4 hover:opacity-70">
        <fa-icon [icon]="faXmark"></fa-icon>
      </button>
    }
  </div>
</div>
